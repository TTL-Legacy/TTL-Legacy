[package]
name = "ttl-legacy-backend"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"

# Axum HTTP server (used by legacy preference + reminder API)
axum = { version = "0.7", features = ["macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry distributed tracing (Issue #1145)
opentelemetry = { version = "0.23", features = ["trace"] }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.16", features = ["tonic", "trace"] }
opentelemetry-semantic-conventions = "0.15"
tracing-opentelemetry = "0.24"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

env_logger = "0.11"
thiserror = "1"
csv = "1"

# SQLite used by the axum DB contract (Db::open/migrate/upsert/get/all)
# NOTE: rusqlite and sqlx-sqlite share `libsqlite3-sys` in this workspace.
# rusqlite 0.30 and sqlx 0.7.4 both resolve to libsqlite3-sys 0.27, so the two
# SQLite bindings unify to a single link unit; newer rusqlite pulls a newer
# libsqlite3-sys that conflicts with sqlx-sqlite 0.7 (which pin ^0.27).
rusqlite = { version = "0.30", features = ["bundled", "i128_blob"] }

# 2FA (TOTP/HMAC-SHA1) and global lazy singletons
hmac = { version = "0.12", features = ["std"] }
sha1 = { version = "0.10" }
once_cell = "1"

# Versioned schema migrations (Issue #1176) — runs migrations/*.sql against
# the same SQLite file the rusqlite-based Db above queries at runtime.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }

# Push notifications (FCM via HTTP v1 API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JWT authentication for WebSocket connections
jsonwebtoken = "9"

# Distributed cache for multi-node consensus checks
redis = "0.27"

# Recovery code generation and hashing
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"

