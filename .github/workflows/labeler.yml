name: Label PR by Changed Paths

# Reads .github/labeler.yml from the base branch and labels the pull request.
# pull_request_target gives a PR from a fork a token that can write labels. It is
# safe here because the workflow never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
