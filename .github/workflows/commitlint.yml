name: Lint PR Title (Conventional Commits)

# Runs on every pull request targeting main to enforce conventional commit
# format on the PR title.  PR titles become the squash-merge commit message,
# so they must follow the conventional commit spec that git-cliff reads.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: Check PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install commitlint CLI and conventional-commits config
        run: |
          npm install --save-dev \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19

      - name: Lint PR title
        run: |
          echo "${{ github.event.pull_request.title }}" | npx commitlint

  commits:
    name: Check Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # the whole history, so the commits of the PR can be listed
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install commitlint CLI and conventional-commits config
        run: |
          npm install --no-save \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19

      # Every commit of the PR, not only the last one: --from HEAD~1 would skip
      # the earlier commits of a PR that has several.
      - name: Lint the commit messages of the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
