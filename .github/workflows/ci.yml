name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contracts
        run: cargo build --workspace

      - name: Build release WASM
        run: |
          cargo build --package ttl-vault --target wasm32-unknown-unknown --release
          cargo build --package zk-verifier --target wasm32-unknown-unknown --release

      - name: Check WASM size
        run: |
          SIZE=$(stat -c%s target/wasm32-unknown-unknown/release/ttl_vault.wasm)
          THRESHOLD=$((256 * 1024))
          if [ "$SIZE" -gt "$THRESHOLD" ]; then
            echo "WASM size exceeds threshold by $(( (SIZE - THRESHOLD) / 1024 )) KB"
            echo "WASM size: $(( SIZE / 1024 )) KB (threshold: 256 KB)"
            exit 1
          fi
          echo "WASM size: $(( SIZE / 1024 )) KB (threshold: 256 KB)"

      - name: Comment WASM size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const path = 'target/wasm32-unknown-unknown/release/ttl_vault.wasm';
            if (fs.existsSync(path)) {
              const size = fs.statSync(path).size;
              const kb = (size / 1024).toFixed(2);
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `📦 **WASM Size Report**: ${kb} KB (threshold: 256 KB)`
              });
            }

      - name: Run tests
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit admin-only functions for require_auth coverage
        run: bash scripts/audit_admin_auth.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --config .gitleaks.toml --redact --fail

      - name: Validate OpenAPI specification
        run: |
          python3 -m pip install openapi-spec-validator --quiet
          python3 -m openapi_spec_validator docs/openapi.yaml
          echo "✅ OpenAPI spec validation passed"

      - name: Check contract error docs are up to date
        run: |
          python3 scripts/generate_contract_error_docs.py
          if ! git diff --exit-code docs/contract-errors.md; then
            echo "docs/contract-errors.md is out of date. Run scripts/generate_contract_error_docs.py and commit the result."
            exit 1
          fi
          echo "✅ Contract error docs are up to date"

      - name: Check version consistency
        run: |
          CHANGELOG_VERSION=$(grep -m 1 "^## \[" CHANGELOG.md | sed -E 's/## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          LIB_VERSION=$(grep -oE 'DataKey::Version.*"([0-9]+\.[0-9]+\.[0-9]+)"' contracts/ttl_vault/src/lib.rs | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$CHANGELOG_VERSION" != "$LIB_VERSION" ]; then
            echo "Version mismatch: CHANGELOG ($CHANGELOG_VERSION) != lib.rs ($LIB_VERSION)"
            exit 1
          fi

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown
          components: clippy, llvm-tools-preview

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Generate coverage report
        run: cargo llvm-cov --package ttl-vault --lcov --output-path lcov.info

      - name: Check minimum coverage threshold
        run: cargo llvm-cov --package ttl-vault --fail-under-lines 70

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
