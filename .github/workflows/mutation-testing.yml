# Mutation testing CI workflow — Issue #1180
#
# Runs cargo-mutants against the ttl-vault contract on every pull request and
# uploads a plain-text survival report as a GitHub Actions artifact.
#
# IMPORTANT: Results are *informational only*.  This job is intentionally set
# to continue-on-error: true so that surviving mutants do not block PR merges.
# The goal is to surface coverage gaps over time, not gate every PR.

name: Mutation Testing

on:
  pull_request:

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Mutation Testing (informational)
    runs-on: ubuntu-latest
    # Results are informational — do not block PR merges.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation tests
        # Pipe stdout + stderr to a report file so it survives as an artifact.
        # The exit code is ignored because the job is non-blocking.
        # Scope mutation testing to ranking.rs and matching.rs (Issue #1813).
        run: |
          cargo mutants --package ttl-vault \
            --file src/ranking.rs \
            --file src/matching.rs \
            2>&1 | tee mutants-report.txt

      - name: Parse mutation score and enforce threshold
        run: |
          REPORT_FILE="mutants-report.txt"
          THRESHOLD=80

          if [ ! -f "$REPORT_FILE" ]; then
            echo "Error: Mutation report not found"
            exit 1
          fi

          SURVIVAL_RATE=$(grep -oP 'survival rate\s*=\s*\K[0-9.]+(?=%)' "$REPORT_FILE" | head -1)

          if [ -z "$SURVIVAL_RATE" ]; then
            echo "⚠️  Could not parse mutation score from report"
            SURVIVAL_RATE=0
          fi

          echo "📊 Mutation Testing Score: ${SURVIVAL_RATE}% (threshold: ${THRESHOLD}%)"

          if (( $(echo "$SURVIVAL_RATE < $THRESHOLD" | bc -l) )); then
            echo "❌ Mutation survival rate (${SURVIVAL_RATE}%) is below threshold (${THRESHOLD}%)"
            echo "Consider improving test coverage for uncovered code paths"
            exit 1
          else
            echo "✅ Mutation survival rate (${SURVIVAL_RATE}%) meets threshold (${THRESHOLD}%)"
          fi

      - name: Upload mutant survival report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutant-survival-report
          path: mutants-report.txt
          retention-days: 14
        if: always()

  # #2081 — mutation testing for backend/src/consensus.rs.
  # Fails the CI pipeline if the mutation score drops below 80 %.
  mutation-testing-consensus:
    name: Mutation Testing – consensus.rs (enforced ≥ 80 %)
    runs-on: ubuntu-latest
    # This job IS blocking: a score below 80 % fails the PR.
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-consensus-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-consensus-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation tests against consensus.rs
        # Scope mutation testing to consensus.rs only (Issue #2081).
        # cargo-mutants exits non-zero when mutants survive, so we capture
        # output and handle the threshold check ourselves.
        run: |
          cargo mutants --package ttl-backend \
            --file src/consensus.rs \
            2>&1 | tee consensus-mutants-report.txt || true

      - name: Enforce 80 % mutation score for consensus.rs
        run: |
          REPORT_FILE="consensus-mutants-report.txt"
          THRESHOLD=80

          if [ ! -f "$REPORT_FILE" ]; then
            echo "Error: consensus mutation report not found"
            exit 1
          fi

          # cargo-mutants summary line: "X mutants tested, Y caught, Z missed, N unviable"
          TOTAL=$(grep -oP '\d+(?= mutants tested)' "$REPORT_FILE" | head -1)
          CAUGHT=$(grep -oP '\d+(?= caught)' "$REPORT_FILE" | head -1)

          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "⚠  Could not parse mutation totals from report; treating as passing."
            cat "$REPORT_FILE"
            exit 0
          fi

          SCORE=$(echo "scale=2; ($CAUGHT * 100) / $TOTAL" | bc)
          echo "📊 consensus.rs mutation score: ${SCORE}% caught (${CAUGHT}/${TOTAL}), threshold: ${THRESHOLD}%"

          if (( $(echo "$SCORE < $THRESHOLD" | bc -l) )); then
            echo "❌ Mutation score (${SCORE}%) is below the ${THRESHOLD}% threshold."
            echo "   See backend/tests/MUTATION_COVERAGE.md for the baseline and surviving mutants."
            exit 1
          else
            echo "✅ Mutation score (${SCORE}%) meets the ${THRESHOLD}% threshold."
          fi

      - name: Upload consensus mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consensus-mutant-report
          path: consensus-mutants-report.txt
          retention-days: 30
        if: always()
