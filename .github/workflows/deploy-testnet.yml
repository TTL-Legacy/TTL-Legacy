name: Deploy to Testnet on Release

on:
  release:
    types: [published]

env:
  STELLAR_CLI_VERSION: "21.4.0"
  CARGO_TERM_COLOR: always

jobs:
  deploy-testnet:
    name: Build & Deploy to Stellar Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # Required for OIDC if used in future

    outputs:
      contract_id: ${{ steps.deploy.outputs.contract_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build WASM artifact
        run: cargo build --package ttl-vault --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Configure testnet deployer identity
        run: |
          stellar keys add deployer-testnet \
            --secret-key "${{ secrets.STELLAR_TESTNET_ACCOUNT_SECRET }}"
          DEPLOYER_ADDR=$(stellar keys address deployer-testnet)
          echo "DEPLOYER_ADDR=${DEPLOYER_ADDR}" >> "$GITHUB_ENV"
          echo "Deployer address: ${DEPLOYER_ADDR}"

      - name: Deploy contract
        id: deploy
        run: |
          set -euo pipefail
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/ttl_vault.wasm \
            --source deployer-testnet \
            --network testnet)
          echo "CONTRACT_ID=${CONTRACT_ID}" >> "$GITHUB_ENV"
          echo "contract_id=${CONTRACT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: ${CONTRACT_ID}"

      - name: Save deployment artifact
        run: |
          mkdir -p deploy-artifacts
          cat > deploy-artifacts/testnet-deployment.txt <<EOF
          release_tag=${{ github.event.release.tag_name }}
          contract_id=${CONTRACT_ID}
          deployer=${DEPLOYER_ADDR}
          network=testnet
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_id=${{ github.run_id }}
          EOF
          cat deploy-artifacts/testnet-deployment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment-${{ github.event.release.tag_name }}
          path: deploy-artifacts/
          retention-days: 90

      - name: Post contract ID as release comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const contractId = process.env.CONTRACT_ID;
            const tag = context.payload.release.tag_name;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.release.id,
              body: [
                `## 🚀 Testnet Deployment — ${tag}`,
                '',
                `**Contract ID:** \`${contractId}\``,
                `**Network:** Stellar Testnet`,
                `**Deployer:** \`${process.env.DEPLOYER_ADDR}\``,
                `**Workflow run:** [${context.runId}](${runUrl})`,
                '',
                '_Use this contract ID to configure the testnet frontend or run integration tests._',
              ].join('\n'),
            });

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-testnet
    timeout-minutes: 5
    steps:
      - name: Confirm deployment artifact
        run: |
          echo "Deployed contract: ${{ needs.deploy-testnet.outputs.contract_id }}"
          echo "Smoke tests run separately via testnet-smoke.yml (nightly schedule)."
          echo "To run smoke test now: gh workflow run testnet-smoke.yml"
