name: Testnet Smoke Test

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly
  workflow_dispatch:

env:
  STELLAR_CLI_VERSION: "21.4.0"

jobs:
  smoke-test:
    name: Stellar Testnet Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build contract WASM
        run: cargo build --package ttl-vault --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      # Generate per-run key names so parallel runs don't collide in the
      # local stellar-cli config store.
      - name: Set up test accounts
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # --- Admin: deploys and initializes the contract ---
          if [ -n "${{ secrets.TESTNET_ADMIN_SECRET }}" ]; then
            stellar keys add "smoke-admin-${SUFFIX}" \
              --secret-key "${{ secrets.TESTNET_ADMIN_SECRET }}"
          else
            stellar keys generate "smoke-admin-${SUFFIX}" --network testnet
          fi
          ADMIN_ADDR=$(stellar keys address "smoke-admin-${SUFFIX}")
          curl -sSf "https://friendbot.stellar.org?addr=${ADMIN_ADDR}" > /dev/null
          sleep 5

          # --- Owner: create_vault / deposit / check_in / cancel_vault ---
          if [ -n "${{ secrets.TESTNET_OWNER_SECRET }}" ]; then
            stellar keys add "smoke-owner-${SUFFIX}" \
              --secret-key "${{ secrets.TESTNET_OWNER_SECRET }}"
          else
            stellar keys generate "smoke-owner-${SUFFIX}" --network testnet
          fi
          OWNER_ADDR=$(stellar keys address "smoke-owner-${SUFFIX}")
          curl -sSf "https://friendbot.stellar.org?addr=${OWNER_ADDR}" > /dev/null
          sleep 5

          # --- Beneficiary: address only, no funding needed ---
          stellar keys generate "smoke-bene-${SUFFIX}" --network testnet
          BENE_ADDR=$(stellar keys address "smoke-bene-${SUFFIX}")

          # --- Twenty funded beneficiaries for the varying-BPS payout E2E ---
          : > smoke-beneficiaries.tsv
          python3 - <<'PY'
          import json
          import subprocess

          suffix = "${SUFFIX}"
          for i in range(20):
              key_name = f"smoke-bene-{i:02d}-{suffix}"
              subprocess.run(
                  ["stellar", "keys", "generate", key_name, "--network", "testnet"],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              address = subprocess.check_output(
                  ["stellar", "keys", "address", key_name],
                  text=True,
              ).strip()
              subprocess.run(
                  ["curl", "-sSf", f"https://friendbot.stellar.org?addr={address}"],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              with open("smoke-beneficiaries.tsv", "a", encoding="utf-8") as output:
                  output.write(f"{i}\t{address}\n")
          PY
          sleep 5

          python3 - <<'PY' >> "$GITHUB_ENV"
          with open("smoke-beneficiaries.tsv", encoding="utf-8") as source:
              for line in source:
                  index, address = line.rstrip().split("\t", 1)
                  print(f"BENE_ADDR_{int(index):02d}={address}")
          PY

          echo "KEY_SUFFIX=${SUFFIX}"     >> "$GITHUB_ENV"
          echo "ADMIN_ADDR=${ADMIN_ADDR}" >> "$GITHUB_ENV"
          echo "OWNER_ADDR=${OWNER_ADDR}" >> "$GITHUB_ENV"
          echo "BENE_ADDR=${BENE_ADDR}"   >> "$GITHUB_ENV"

          echo "Admin:       ${ADMIN_ADDR}"
          echo "Owner:       ${OWNER_ADDR}"
          echo "Beneficiary: ${BENE_ADDR}"

      - name: Deploy contract
        run: |
          set -euo pipefail
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/ttl_vault.wasm \
            --source "smoke-admin-${KEY_SUFFIX}" \
            --network testnet)
          echo "CONTRACT_ID=${CONTRACT_ID}" >> "$GITHUB_ENV"
          echo "Deployed: ${CONTRACT_ID}"

      - name: Save contract address artifact
        run: |
          mkdir -p smoke-results
          cat > smoke-results/contract.txt <<EOF
          contract_id=${CONTRACT_ID}
          run_id=${{ github.run_id }}
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          admin=${ADMIN_ADDR}
          owner=${OWNER_ADDR}
          EOF
          cat smoke-results/contract.txt

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ github.run_id }}
          path: smoke-results/
          retention-days: 7

      - name: Initialize contract
        run: |
          set -euo pipefail
          XLM_TOKEN=$(stellar contract id asset --asset native --network testnet)
          echo "XLM_TOKEN=${XLM_TOKEN}" >> "$GITHUB_ENV"

          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-admin-${KEY_SUFFIX}" \
            --network testnet \
            -- initialize \
            --xlm_token "${XLM_TOKEN}" \
            --admin "${ADMIN_ADDR}"

          echo "Initialized with native XLM SAC: ${XLM_TOKEN}"

      - name: Smoke — create vault
        run: |
          set -euo pipefail
          VAULT_ID=$(stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- create_vault \
            --owner "${OWNER_ADDR}" \
            --beneficiary "${BENE_ADDR}" \
            --check_in_interval 86400 \
            --token_address null)

          # Strip any surrounding quotes from the returned u64
          VAULT_ID="${VAULT_ID//\"/}"
          echo "VAULT_ID=${VAULT_ID}" >> "$GITHUB_ENV"
          echo "Created vault: ${VAULT_ID}"

      - name: Smoke — deposit
        run: |
          set -euo pipefail
          # 10 XLM expressed in stroops (1 XLM = 10_000_000 stroops)
          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- deposit \
            --vault_id "${VAULT_ID}" \
            --from "${OWNER_ADDR}" \
            --amount 100000000
          echo "Deposited 10 XLM into vault ${VAULT_ID}"

      - name: Smoke — check-in
        run: |
          set -euo pipefail
          # Any deterministic 32-byte value works as a passkey hash in the smoke test
          PASSKEY_HASH=$(echo -n "ttl-legacy-smoke-test" | sha256sum | awk '{print $1}')

          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- check_in \
            --vault_id "${VAULT_ID}" \
            --caller "${OWNER_ADDR}" \
            --passkey_hash "${PASSKEY_HASH}"

          echo "Checked in (passkey: ${PASSKEY_HASH})"

      - name: Smoke — get TTL remaining
        run: |
          set -euo pipefail
          TTL=$(stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- get_ttl_remaining \
            --vault_id "${VAULT_ID}")

          echo "TTL remaining: ${TTL}"

          if [ "${TTL}" = "null" ] || [ -z "${TTL}" ]; then
            echo "::error::get_ttl_remaining returned null — vault has already expired"
            exit 1
          fi

          echo "::notice::Smoke test passed. Vault ${VAULT_ID} TTL: ${TTL}s remaining"

      - name: Smoke — 20-beneficiary varying-BPS release
        run: |
          set -euo pipefail

          # Build the 20-entry Soroban Vec in CLI JSON format.
          BENEFICIARY_JSON=$(python3 <<'PY'
          import json
          import os

          entries = []
          for i in range(20):
              address = os.environ[f"BENE_ADDR_{i:02d}"]
              bps = 25 if i == 0 else ((i + 1) * 25 if i < 19 else 5250)
              entries.append({
                  "address": address,
                  "bps": bps,
                  "minimum_threshold": 0,
              })
          print(json.dumps(entries, separators=(",", ":")))
          PY
          )

          SPLIT_VAULT_ID=$(stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- create_vault \
            --owner "${OWNER_ADDR}" \
            --beneficiary "${BENE_ADDR_00}" \
            --check_in_interval 3600 \
            --token_address null)
          SPLIT_VAULT_ID="${SPLIT_VAULT_ID//\"/}"
          echo "SPLIT_VAULT_ID=${SPLIT_VAULT_ID}" >> "$GITHUB_ENV"

          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- set_beneficiaries \
            --vault_id "${SPLIT_VAULT_ID}" \
            --caller "${OWNER_ADDR}" \
            --beneficiaries "${BENEFICIARY_JSON}"

          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- deposit \
            --vault_id "${SPLIT_VAULT_ID}" \
            --from "${OWNER_ADDR}" \
            --amount 100000000

          python3 <<'PY' > split-baselines.tsv
          import json
          import os
          import urllib.request

          for i in range(20):
              address = os.environ[f"BENE_ADDR_{i:02d}"]
              with urllib.request.urlopen(
                  f"https://horizon-testnet.stellar.org/accounts/{address}",
                  timeout=20,
              ) as response:
                  account = json.load(response)
              native = next(
                  balance["balance"]
                  for balance in account["balances"]
                  if balance["asset_type"] == "native"
              )
              print(f"{i}\t{native}")
          PY

          # The contract requires 3,600 seconds of inactivity. Poll the real
          # testnet TTL, waiting for expiry before invoking release.
          for attempt in $(seq 1 150); do
            TTL=$(stellar contract invoke \
              --id "${CONTRACT_ID}" \
              --source "smoke-owner-${KEY_SUFFIX}" \
              --network testnet \
              -- get_ttl_remaining \
              --vault_id "${SPLIT_VAULT_ID}" || true)
            TTL="${TTL//\"/}"
            if [ "${TTL}" = "0" ] || [ "${TTL}" = "null" ] || [ -z "${TTL}" ]; then
              break
            fi
            echo "Waiting for split vault expiry (${attempt}/150): ${TTL}s"
            sleep 30
          done

          # trigger_release waits for and is committed into one ledger close.
          # Immediately read Horizon state, which confirms the payout landed.
          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source "smoke-owner-${KEY_SUFFIX}" \
            --network testnet \
            -- trigger_release \
            --vault_id "${SPLIT_VAULT_ID}"

          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from decimal import Decimal

          stroops_per_xlm = Decimal("10000000")
          deposit_stroops = 100_000_000

          baselines = {}
          with open("split-baselines.tsv", encoding="utf-8") as source:
              for line in source:
                  index, balance = line.rstrip().split("\t", 1)
                  baselines[int(index)] = Decimal(balance) * stroops_per_xlm

          for i in range(20):
              address = os.environ[f"BENE_ADDR_{i:02d}"]
              bps = 25 if i == 0 else ((i + 1) * 25 if i < 19 else 5250)
              expected = (
                  deposit_stroops * bps // 10_000
                  if i < 19
                  else deposit_stroops
                  - sum(
                      deposit_stroops * (
                          25 if j == 0 else ((j + 1) * 25 if j < 19 else 5250)
                      ) // 10_000
                      for j in range(19)
                  )
              )

              deadline = time.monotonic() + 60
              while True:
                  try:
                      with urllib.request.urlopen(
                          f"https://horizon-testnet.stellar.org/accounts/{address}",
                          timeout=20,
                      ) as response:
                          account = json.load(response)
                      native = next(
                          balance["balance"]
                          for balance in account["balances"]
                          if balance["asset_type"] == "native"
                      )
                      after = Decimal(native) * stroops_per_xlm
                      received = after - baselines[i]
                      if received == expected:
                          print(
                              f"Beneficiary {i}: received {received} stroops "
                              f"(expected {expected})"
                          )
                          break
                  except (urllib.error.URLError, StopIteration):
                      pass
                  if time.monotonic() >= deadline:
                      raise AssertionError(
                          f"Beneficiary {i}: balance did not increase by {expected} "
                          f"stroops within one ledger-close verification window"
                      )
                  time.sleep(1)
          PY

      # Runs even on failure so we don't leave funded vaults open on testnet.
      - name: Cleanup — cancel vault
        if: always()
        run: |
          if [ -z "${CONTRACT_ID:-}" ]; then
            echo "Nothing to clean up (contract not created)"
            exit 0
          fi
          for vault_id in "${VAULT_ID:-}" "${SPLIT_VAULT_ID:-}"; do
            if [ -z "${vault_id}" ]; then
              continue
            fi
            stellar contract invoke \
              --id "${CONTRACT_ID}" \
              --source "smoke-owner-${KEY_SUFFIX}" \
              --network testnet \
              -- cancel_vault \
              --vault_id "${vault_id}" \
              --caller "${OWNER_ADDR}" \
              && echo "Vault ${vault_id} cancelled (refund returned to owner)" \
              || echo "Warning: cancel_vault failed — vault may already be cancelled or deposit never landed"
          done

      # Opens a GitHub issue on first failure; comments on the existing open
      # issue for repeated failures so the tracker stays clean.
      - name: Alert — file failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];
            const failureLabel = 'testnet-smoke-failure';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: failureLabel,
              state: 'open',
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Repeated failure on **${date}** → [Run ${context.runId}](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Testnet smoke test failed (${date})`,
                body: [
                  '## Testnet Smoke Test Failure',
                  '',
                  `**Run:** [${context.runId}](${runUrl})`,
                  `**Date:** ${new Date().toISOString()}`,
                  `**Trigger:** ${context.eventName}`,
                  '',
                  'The nightly testnet smoke test failed. Sequence tested:',
                  '',
                  '1. Build `ttl_vault` WASM',
                  '2. Deploy to Stellar Testnet',
                  '3. Initialize contract (native XLM token + admin)',
                  '4. `create_vault` (owner, beneficiary, 24 h interval)',
                  '5. `deposit` 10 XLM',
                  '6. `check_in`',
                  '7. `get_ttl_remaining` — assert non-null',
                  '8. 20-beneficiary varying-BPS vault: set split, deposit 10 XLM',
                  '9. Wait for 1-hour TTL expiry, trigger release',
                  '10. Verify all 20 Horizon account balances within the ledger-close window',
                  '11. `cancel_vault` (cleanup)',
                  '',
                  'Check the workflow run for the failing step and investigate',
                  'deployment fees, contract init, token setup, or network issues.',
                  '',
                  'Close this issue once the root cause is resolved.',
                ].join('\n'),
                labels: ['infrastructure', failureLabel],
              });
            }
