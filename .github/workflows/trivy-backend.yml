name: Backend image scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy scan (backend image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      IMAGE: ttl-legacy-backend:scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t "$IMAGE" .

      - name: Generate vulnerability report (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Comment severity summary on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('trivy-report.json', 'utf8'));
            const vulns = (report.Results || []).flatMap((r) => r.Vulnerabilities || []);
            const count = (severity) => vulns.filter((v) => v.Severity === severity).length;
            const body = [
              '### Trivy backend image scan',
              '',
              '| Severity | Count |',
              '|---|---|',
              `| CRITICAL | ${count('CRITICAL')} |`,
              `| HIGH | ${count('HIGH')} |`,
              '',
              'The CycloneDX SBOM is attached to this workflow run as the `backend-sbom` artifact.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: sbom.cdx.json
