# cargo-deny configuration.
#
# CI runs `cargo deny check bans`, which fails when a PR introduces a new
# duplicate crate version. Every entry in `skip` is a duplicate that already
# existed in Cargo.lock when this file was added. Remove an entry once the
# duplicate is gone. Do not add entries without a reason.

