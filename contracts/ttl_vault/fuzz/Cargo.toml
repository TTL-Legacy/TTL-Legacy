[package]
name = "ttl-vault-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
stellar-xdr = "21.2.0"
ttl-vault = { path = "..", features = ["testutils"] }

[[bin]]
name = "fuzz_vesting"
path = "src/fuzz_vesting.rs"
test = false
doc = false

[[bin]]
name = "fuzz_create_vault"
path = "src/fuzz_create_vault.rs"
test = false
doc = false

[[bin]]
name = "fuzz_deposit"
path = "src/fuzz_deposit.rs"
test = false
doc = false

[[bin]]
name = "fuzz_withdraw"
path = "src/fuzz_withdraw.rs"
test = false
doc = false

[[bin]]
name = "fuzz_check_in"
path = "src/fuzz_check_in.rs"
test = false
doc = false

[[bin]]
name = "fuzz_xdr_scval"
path = "src/fuzz_xdr_scval.rs"
test = false
doc = false

[[bin]]
name = "fuzz_contract_xdr"
path = "src/fuzz_contract_xdr.rs"
test = false
doc = false

[[bin]]
name = "fuzz_withdrawal_splitting"
path = "src/fuzz_withdrawal_splitting.rs"
test = false
doc = false

[[bin]]
name = "fuzz_passkey_signature"
path = "src/fuzz_passkey_signature.rs"
test = false
doc = false
